services:
  backend:
    build:
      context: ./backend
    environment:
      SERVER_ADDRESS: ":8080"
      JWT_SECRET: "change-me-in-production"
      DB_DSN: "file:data/app.db?cache=shared&mode=rwc"
      OPENAI_TIMEOUT_SECONDS: "30"
    volumes:
      - backend_data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5183:80"
    depends_on:
      - backend

volumes:
  backend_data:
