# Compose reads `.env` from this directory for `${VAR}` substitution below.
# Copy `.env.example` to `.env` and adjust (especially JWT_SECRET and Zhihu keys).

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SERVER_ADDRESS: "${SERVER_ADDRESS:-:8080}"
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      DB_DSN: ${DB_DSN:-file:data/app.db?cache=shared&mode=rwc}
      # 镜像内默认已含领域文件；阿里云可用卷挂载后把该变量指到挂载路径
      EVAL_WORKSPACE_DOMAINS: ${EVAL_WORKSPACE_DOMAINS:-/app/eval-workspace/domains}
      OPENAI_TIMEOUT_SECONDS: ${OPENAI_TIMEOUT_SECONDS:-30}
      ZHIHU_APP_ID: ${ZHIHU_APP_ID:-}
      ZHIHU_APP_KEY: ${ZHIHU_APP_KEY:-}
      ZHIHU_REDIRECT_URI: ${ZHIHU_REDIRECT_URI:-http://localhost:8080/api/v1/auth/zhihu/callback}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost}
      ZHIHU_OPENAPI_HOST: ${ZHIHU_OPENAPI_HOST:-openapi.zhihu.com}
    volumes:
      - backend_data:/app/data
    ports:
      - "8080:8080"

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  backend_data:
